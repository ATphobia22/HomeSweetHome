    <style>
        @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap');
        
        :root {
            --safe-top: env(safe-area-inset-top);
            --safe-bottom: env(safe-area-inset-bottom);
            --cyan-glow: 0 0 20px rgba(6, 182, 212, 0.5);
            --emerald-glow: 0 0 20px rgba(16, 185, 129, 0.5);
        }

        body {
            font-family: 'Space Grotesk', sans-serif;
            background-color: #000000;
            color: #f8fafc;
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
            padding: var(--safe-top) 0 var(--safe-bottom) 0;
            user-select: none;
        }

        .mono { font-family: 'JetBrains Mono', monospace; }

        .iphone-card {
            background: linear-gradient(165deg, rgba(20, 20, 20, 0.85), rgba(5, 5, 5, 0.98));
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.95);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .scanner-line {
            position: absolute;
            width: 100%;
            height: 3px;
            background: linear-gradient(90deg, transparent, #06b6d4, #10b981, transparent);
            animation: scan 3s infinite ease-in-out;
            z-index: 10;
            filter: blur(1px);
        }

        @keyframes scan {
            0% { transform: translateY(-100%); opacity: 0; }
            20% { opacity: 0.8; }
            80% { opacity: 0.8; }
            100% { transform: translateY(800px); opacity: 0; }
        }

        .vhd-title {
            font-size: 18rem;
            line-height: 0.55;
            letter-spacing: -0.06em;
            font-weight: 900;
            font-style: italic;
            text-transform: uppercase;
            background: linear-gradient(180deg, #fff 0%, #333 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 30px rgba(0,0,0,0.5));
        }

        .vhd-title-cyan {
            background: linear-gradient(180deg, #06b6d4 0%, #083344 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .pulse-active {
            animation: active-pulse 2s infinite cubic-bezier(0.4, 0, 0.6, 1);
        }

        @keyframes active-pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.7; transform: scale(0.98); }
        }

        @media (max-width: 768px) {
            .vhd-title { font-size: 6rem; }
        }

        ::-webkit-scrollbar { width: 0px; display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
        
        .glass-panel {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
        }
    </style>
